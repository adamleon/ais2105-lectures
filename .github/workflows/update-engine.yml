name: Update engine

# Changes the Lysark engine version without needing npm on a computer
# (lysark-v2.md §3): run it from the Actions tab and type the version tag.
# It updates package.json and package-lock.json, commits them, and starts
# "Publish lectures", which rebuilds every lecture with the new engine.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Engine version tag, for example v2.1.0'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check that the tag exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' doesn't look like a version tag such as v2.1.0"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags https://github.com/adamleon/lysark.git "refs/tags/$TAG" > /dev/null; then
            echo "::error::The engine has no tag '$TAG'"
            exit 1
          fi

      - name: Pin the engine to the tag
        env:
          TAG: ${{ inputs.tag }}
        run: npm install "github:adamleon/lysark#$TAG"

      - name: Commit and push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Already on engine $TAG; nothing to commit."
          else
            git commit -m "Use engine $TAG"
            git push
          fi

      # a push made with the workflow's own token starts no other workflow,
      # so start the publish explicitly
      - name: Start "Publish lectures"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
